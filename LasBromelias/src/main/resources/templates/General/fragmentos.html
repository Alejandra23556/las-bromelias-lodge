<!-- Head Reutilizable -->

<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Las Bromelias Lodge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<!-- Fragmento 1: NavBar -->

<header th:fragment="header" class="custom-navbar px-3 py-2">
    <nav class="navbar navbar-expand-lg p-0">
        <div class="container-fluid p-0">

            <!-- logo y nombre-->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img th:src="@{/img/Logo.svg}" alt="Las Bromelias Lodge" height="60" class="me-2">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <!-- Enlaces centrales -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link custom-link active" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link custom-link" th:href="@{/cabanas}">Cabañas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link custom-link" href="#">Información</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link custom-link" href="#">Contacto</a>
                    </li>
                </ul>

                <!-- Idioma y botones -->
                <div class="d-flex align-items-center gap-3">
                    <a href="?lang=en" class="text-decoration-none fw-semibold custom-link small">ES/EN</a>

                    <a th:href="@{/login}" class="btn btn-outline-custom rounded-3 px-3 py-1 text-nowrap">
                        Iniciar Sesión
                    </a>

                    <a th:href="@{/registro/nuevo}" class="btn btn-custom rounded-3 px-3 py-1 text-nowrap">
                        Registrarse
                    </a>
                </div>

            </div>
        </div>
    </nav>
</header>


<!-- Fragmento 2: footer -->

<footer th:fragment="footer" class="custom-footer text-white py-3 px-4">
    <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div class="footer-logo">
            <a href="#" class="d-flex align-items-center text-decoration-none">
                <img th:src="@{/img/LogoWhite.svg}" alt="Las Bromelias Lodge" height="60">
            </a>
        </div>

        <div class="footer-copy text-center small text-light opacity-75">
            &copy; 2026 Las Bromelias Lodge. Todos los derechos reservados.
        </div>

        <div class="footer-social d-flex align-items-center gap-3">
            <a href="#" class="text-white text-decoration-none fw-semibold small">Contáctanos</a>
            <span class="text-white-50">|</span>
            <div class="d-flex align-items-center gap-2">

                <a href="#" class="social-icon text-white rounded-circle d-flex align-items-center justify-content-center" title="Teléfono">
                    <i class="bi bi-telephone-fill"></i>
                </a>
                <a href="#" class="social-icon text-white rounded-circle d-flex align-items-center justify-content-center" title="Facebook">
                    <i class="bi bi-facebook"></i>
                </a>
                <a href="#" class="social-icon text-white rounded-circle d-flex align-items-center justify-content-center" title="Ubicación">
                    <i class="bi bi-geo-alt-fill"></i>
                </a>
            </div>
        </div>

    </div>
</footer>
